<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو مزاز الرقمي | Mazaz Juice & Food Menu</title>

    <!-- Meta Data & SEO -->
    <meta name="description" content="منيو مزاز الإلكتروني - تصفح أشهى العصائر الطبيعية والخلطات والوجبات السريعة والميلك شيك من محل مزاز (Mazaz) بأسعار وعروض متجددة.">
    <meta name="keywords" content="مزاز, عصائر مزاز, وجبات سريعة, منيو مزاز, عصير عوار قلب, اصفهاني, ساندوتشات, Mazaz Menu">
    <meta name="author" content="Mazaz Team">
    <meta name="theme-color" content="#00A651">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="منيو مزاز الرقمي | Mazaz Menu">
    <meta property="og:description" content="تصفح منيو عصائر ووجبات مزاز الإلكتروني واستمتع بالطعم المذهل.">
    <meta property="og:image" content="../assets/logo.jpg">
    <meta property="og:locale" content="ar_SA">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpg">
    <link rel="apple-touch-icon" href="../assets/logo.jpg">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Tajawal) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App Header & Hero Banner -->
    <header class="hero-header">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <div class="brand-badge">
                <img src="../assets/logo.jpg" alt="مزاز Mazaz" class="menu-logo">
                <div class="brand-text">
                    <h1>مزاز | MAZAZ</h1>
                    <p><i class="fa-solid fa-location-dot"></i> طعم العصير الحقيقي والوجبات السريعة</p>
                </div>
            </div>
            
            <!-- Quick Search Input -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن عصير، وجبة، أو إضافة...">
                <button id="clearSearchBtn" class="clear-btn" style="display: none;">&times;</button>
            </div>
        </div>
    </header>

    <!-- Categories Navigation Bar (Sticky Horizontal Scroll) -->
    <nav class="categories-nav-wrapper">
        <div class="container">
            <div class="categories-scroll" id="categoriesNav">
                <button class="cat-pill active" data-id="all">
                    <i class="fa-solid fa-fire"></i> الكل
                </button>
                <!-- Categories Pinned Dynamically -->
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container menu-main">
        <!-- System Cache Status / Notice -->
        <div class="menu-status-bar" id="menuStatusBar">
            <span class="status-dot"></span>
            <span id="statusText">جاري مزامنة المنيو...</span>
        </div>

        <!-- Menu Categories & Items Sections -->
        <div id="menuContainer" class="menu-container">
            <!-- Loading Skeleton Cards -->
            <div class="loading-spinner-wrapper">
                <div class="spinner"></div>
                <p>جاري تحضير أشهى المأكولات والعصائر...</p>
            </div>
        </div>
    </main>

    <!-- Product Details Modal (Product Info + Addons) -->
    <div class="modal" id="productDetailModal">
        <div class="modal-content text-right">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <div class="modal-body" id="modalProductDetails">
                <!-- Dynamically Populated -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container">
            <img src="../assets/logo.jpg" alt="مزاز" class="footer-logo">
            <p>جميع الحقوق محفوظة © محل مزاز MAZAZ 2026</p>
        </div>
    </footer>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="app.js"></script>
</body>
</html>
